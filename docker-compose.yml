services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: radio, POSTGRES_PASSWORD: radio, POSTGRES_DB: radio }
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U radio"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    volumes: [media:/data/media, ./assets:/app/assets:ro]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  worker:
    build: .
    command: ["node","dist/src/worker.js"]
    env_file: .env
    volumes: [media:/data/media]
    depends_on: [api]
  stream:
    build: .
    command: ["node","dist/src/stream.js"]
    env_file: .env
    restart: unless-stopped
    volumes: [media:/data/media, ./assets:/app/assets:ro]
    depends_on: [api]
volumes: { postgres: {}, media: {} }
